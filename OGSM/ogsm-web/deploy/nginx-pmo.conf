# 边缘 nginx 接入片段（pmo.luteos.com）
#
# 服务器上是共享边缘 nginx 容器 ai_video_nginx（占 80/443，服务 20+ 个站点）。
# 本片段是它 ai_video_locations.conf 中 pmo 的 server 块，不需要另起 nginx。
#
# 接入方式（见 deploy/apply-nginx.sh）：先备份原文件，再追加本块，reload。
# 证书沿用通配符 *.luteos.com，无需新申请。

# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pmo.luteos.com;

    # ACME 与 HTTP→HTTPS 跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pmo.luteos.com;

    ssl_certificate     /etc/letsencrypt/live/luteos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luteos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:PMOSSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 允许页内交互脚本与 /reports 下的原生 HTML 报告正常渲染
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' https: data: blob:; form-action 'self'; frame-ancestors 'self'" always;

    client_max_body_size 8m;

    access_log /var/log/nginx/pmo.access.log;
    error_log  /var/log/nginx/pmo.error.log warn;

    location / {
        proxy_pass http://172.20.0.1:18960;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 静态资源走边缘缓存，页面本身不缓存（内容随数据库变）
        location ~* \.(css|js|png|jpg|svg|woff2?)$ {
            proxy_pass http://172.20.0.1:18960;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 健康检查不写 access log，避免刷日志
    location = /health {
        access_log off;
        proxy_pass http://172.20.0.1:18960/health;
        proxy_set_header Host $host;
    }
}
