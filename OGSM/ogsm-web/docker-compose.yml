services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ogsm
      POSTGRES_USER: ogsm
      POSTGRES_PASSWORD: ogsm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogsm -d ogsm"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
